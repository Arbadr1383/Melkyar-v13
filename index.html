  <style id="melkyar-boot-fallback">
    /* Theme-safe fallback: never hard-code the navy palette. */
    html,body{margin:0;padding:0;min-height:100%;direction:rtl}body{background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif}.app-shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:var(--sidebar-bg);color:var(--sidebar-text);padding:1.4rem 1rem;min-height:100vh}.sidebar__nav{display:flex;flex-direction:column;gap:.2rem;margin-top:18px}.nav-item{display:flex;align-items:center;gap:.7rem;padding:.65rem .8rem;border-radius:10px;color:var(--sidebar-text);text-decoration:none}.nav-item--active{background:var(--accent);color:var(--accent-contrast);font-weight:700}.main-column{min-width:0}.topbar{display:flex;gap:12px;align-items:center;padding:14px 20px;background:var(--bg-elevated);border-bottom:1px solid var(--border)}.page-content{padding:24px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:1px solid transparent;border-radius:10px;padding:8px 16px;background:var(--bg-elevated);color:var(--ink);font:700 14px Tahoma,Arial,sans-serif;cursor:pointer}.btn--primary{background:var(--primary);color:var(--primary-contrast);border-color:var(--primary);box-shadow:0 2px 6px rgba(0,0,0,.12)}.btn--ghost{background:var(--bg-sunken);color:var(--ink);border-color:var(--border)}.btn--danger{background:var(--rust);color:#fff;border-color:var(--rust)}.panel,.dashboard-module-card,.table-wrap{background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px}.dashboard-module-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.dashboard-module-card{display:flex;gap:10px;padding:18px;color:var(--ink);text-decoration:none}.sidebar__logo-img{width:72px;height:72px;object-fit:cover;border-radius:18px}.topbar__search{flex:1;max-width:520px}.topbar__search input{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px}.topbar__actions{display:flex;gap:8px;align-items:center}.user-chip,.icon-btn{border:1px solid var(--border);background:var(--bg-sunken);color:var(--ink);border-radius:10px;padding:9px}.theme-option{font:700 14px Tahoma,Arial,sans-serif}.toast-host{position:fixed;bottom:20px;left:20px;z-index:99999}@media(max-width:800px){.app-shell{grid-template-columns:1fr}.sidebar{display:none}}
  </style>
</head>
<body data-developer="Swanco-Alireza-Badr-Melkyar"><!-- Developer Signature: SWANCO | Alireza Badr | Melkyar | شرکت برنامه نویسی قو (سهامی خاص) -->
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <img class="sidebar__logo-img" src="assets/logo.jpg" alt="لوگوی ملک‌یار">
        <span class="sidebar__tagline">سامانه حرفه‌ای مدیریت املاک</span>
      </div>
      <nav id="sidebar-nav" class="sidebar__nav"></nav>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="topbar__search">
          <span class="topbar__search-icon">⌕</span>
          <input id="global-search" type="search" placeholder="جستجوی فایل، مشتری یا «کد ۱۲۳»…">
        </div>
        <div class="topbar__actions">
          <div class="notif-wrap">
            <button id="notif-bell" class="icon-btn" aria-label="اعلان‌ها">
              🔔<span id="notif-badge" class="notif-badge"></span>
            </button>
            <div id="notif-panel" class="notif-panel">
              <h4>اعلان‌ها</h4>
              <ul id="notif-list"></ul>
            </div>
          </div>
          <button id="current-user-btn" class="user-chip" type="button" title="خروج">
            <span>👤</span><span id="current-user-name">کاربر</span>
          </button>
          <button id="theme-toggle" class="icon-btn" aria-label="تغییر تم">🎨</button>
        </div>
      </header>

      <main id="page-content" class="page-content"></main>
    </div>
  </div>

  <div id="toast-host" class="toast-host"></div>

  <script>
    (function(){
      window.addEventListener('error',function(e){
        if(e.target && (e.target.tagName==='SCRIPT' || e.target.tagName==='LINK' || e.target.tagName==='IMG')){
          console.warn('Melkyar resource failed:', e.target.src || e.target.href || e.target.currentSrc);
        }
      },true);
    })();
  </script>
